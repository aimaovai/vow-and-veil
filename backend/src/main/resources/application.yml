spring:
  application:
    name: vow-and-veil
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vow_and_veil}
    username: ${DB_USERNAME:vowandveil}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  security:
    csrf:
      enabled: true
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
