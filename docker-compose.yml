services:
  postgres:
    image: postgres:16-alpine
    container_name: vowandveil-postgres
    environment:
      POSTGRES_DB: vow_and_veil
      POSTGRES_USER: vowandveil
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: vowandveil-backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vow_and_veil
      DB_USERNAME: vowandveil
      DB_PASSWORD: secret
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: vowandveil-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"

volumes:
  postgres_data:
